name: libracore

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      TZ: ${DB_TIMEZONE:-Asia/Jakarta}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Published on localhost only, for pgAdmin/psql on this machine.
    # Port 5433 avoids clashing with a local PostgreSQL on 5432.
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"

  api:
    build: ./backend
    image: libracore-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Jakarta}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Library Admin}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_BORROWER_EMAIL: ${BOOTSTRAP_BORROWER_EMAIL:-}
      BOOTSTRAP_BORROWER_PASSWORD: ${BOOTSTRAP_BORROWER_PASSWORD:-}
      DAILY_FINE_IDR: ${DAILY_FINE_IDR:-2000}
      MAX_LOAN_ITEMS: ${MAX_LOAN_ITEMS:-5}
      LOAN_PERIOD_DAYS: ${LOAN_PERIOD_DAYS:-14}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-10}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build: ./frontend
    image: libracore-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  db_data:
